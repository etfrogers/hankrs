name: Security & License Audit

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Run every Sunday at 00:00 UTC to catch newly reported CVEs or unmaintained crates
    - cron: '0 0 * * 0'

jobs:
  cargo-deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  cargo-audit:
    name: cargo-audit (vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo-audit
        run: cargo audit
